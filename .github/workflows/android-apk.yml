# Build an installable Android APK on GitHub's servers — no Expo account, no
# local Android SDK. The APK is debug-signed, which is all you need to sideload
# it onto a phone for testing. Download it from the run's "Artifacts" section.
#
# Trigger: every push to main, or manually from the Actions tab (Run workflow).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install
        env:
          EXPO_PUBLIC_SIMULATED_GAMES: "1"

      - name: Build release APK (debug-signed)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SIMULATED_GAMES: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-arcade-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
